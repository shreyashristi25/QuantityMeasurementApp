server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: measurement-service
          uri: lb://measurement-service
          predicates:
            - Path=/api/measurements/**

        - id: history-service
          uri: lb://history-service
          predicates:
            - Path=/api/history/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: mysecretkeymysecretkeymysecretkey12345

logging:
  level:
    org.springframework.cloud.gateway: DEBUG