# Custom DB keys (used by ConnectionPool)
#db.url=jdbc:mysql://db-instance.cp68kasueog0.ap-southeast-2.rds.amazonaws.com:3306/quantity_db
#db.username=admin
#db.password=password

# Application
spring.application.name=quantity-measurement
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://db-instance.cp68kasueog0.ap-southeast-2.rds.amazonaws.com:3306/quantity_db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional (format SQL)
spring.jpa.properties.hibernate.format_sql=true

# Spring security - OAuth2 (set via environment variables)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
